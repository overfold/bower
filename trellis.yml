# yaml-language-server: $schema=https://raw.githubusercontent.com/overfold/trellis/main/schemas/trellis-job.schema.json
#
# Quick-start Bower deployment for a single-node Trellis cluster.
# Download this file, edit the settings below, then apply the local file.
# Set BOWER_PUBLIC_URL for HTTPS; point its DNS at this node and allow 80/443.
# Create encryption-key and route-auth-secret in platform before applying (see README).
# Password and Bower account protection require BOWER_PUBLIC_URL and the route-auth secret.
# Bower reconciles a separate platform/bower-ingress job on ports 80/443.
# Port 3000 remains published for ingress discovery and troubleshooting.
# The bundled Postgres allocation is intentionally colocated only by virtue of
# the single-node assumption. For multi-node/production deployments, use an
# external Postgres instance and replace DATABASE_URL accordingly.
name: bower
namespace: platform
task_groups:
  - name: db
    count: 1
    tasks:
      - name: postgres
        image: docker.io/library/postgres:16-alpine
        networking:
          mode: namespace
        resources:
          cpu: 250
          memory: 256MiB
        env:
          POSTGRES_USER: bower
          # Change this example password and match it in DATABASE_URL below.
          POSTGRES_PASSWORD: bower
          POSTGRES_DB: bower
        volumes:
          - name: pgdata
            host_path: "@/bower-postgres"
            container_path: /var/lib/postgresql/data
        health_check:
          type: script
          command: ["pg_isready", "-U", "bower"]
          interval: 5s
          timeout: 5s
          threshold: 3

  - name: web
    count: 1
    api_access:
      scope: cluster
      access: write
    tasks:
      - name: bower
        image: ghcr.io/overfold/bower:latest
        networking:
          mode: namespace
          ports:
            - port: 3000
        resources:
          cpu: 500
          memory: 512MiB
        env:
          NODE_ENV: production
          # Uncomment and replace with your dashboard's public origin.
          # Leave commented for HTTP-only setup at http://<node-ip>.
          # BOWER_PUBLIC_URL: https://bower.example.com
          # Match the database password above; URL-encode it in this URL.
          DATABASE_URL: postgres://bower:bower@db.bower.platform.trellis:5432/bower
          BOWER_PROXY_NAMESPACE: platform
          BOWER_RECONCILE_INTERVAL: "5"
          BOWER_CADDY_IMAGE: ghcr.io/overfold/bower-proxy:latest
          BOWER_PROXY_SYNC_IMAGE: ghcr.io/overfold/bower-proxy-sync:latest
          AUTO_MIGRATE: "true"
        secrets:
          - name: encryption-key
            target: env
            env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          # Stable across replicas and updates; separate from the encryption key.
          # Public-only installations can omit this secret and its mapping.
          - name: route-auth-secret
            target: env
            env: BOWER_ROUTE_AUTH_SECRET
        health_check:
          type: http
          port: 3000
          path: /
          interval: 10s
          timeout: 5s
          threshold: 2
