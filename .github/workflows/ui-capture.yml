name: ui-capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bower
          POSTGRES_PASSWORD: bower
          POSTGRES_DB: bower_ui_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bower -d bower_ui_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bower:bower@127.0.0.1:5432/bower_ui_audit
      UI_AUDIT_OUTPUT: ui-audit-output
      NEXT_TELEMETRY_DISABLED: 1
      # Production Bower now expects these values to be stable across build/start.
      # These are isolated audit-only fixtures; never reuse them outside this job.
      BOWER_PUBLIC_URL: http://127.0.0.1:3100
      BOWER_ROUTE_AUTH_SECRET: ui-capture-route-auth-secret-000000000000
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/ui-capture/reporter.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run db:migrate
      - run: node scripts/ui-capture/seed.mjs
      - run: npm run build
      - name: Capture production UI
        run: npx playwright test --config scripts/ui-capture/playwright.config.mjs
      - name: Enforce 30 MB artifact budget
        id: budget
        if: always()
        run: |
          for artifact in desktop narrow diagnostics; do
            directory="ui-audit-output/$artifact"
            if [ -d "$directory" ]; then
              bytes=$(du -sb "$directory" | cut -f1)
              echo "$artifact: $bytes bytes (maximum 30000000)"
              if [ "$bytes" -gt 30000000 ]; then
                echo "::error::$artifact exceeds the 30 MB artifact budget"
                exit 1
              fi
            fi
          done
      - name: Upload desktop captures
        if: always() && steps.budget.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bower-ui-audit-desktop-${{ github.run_number }}
          path: ui-audit-output/desktop/
          if-no-files-found: error
          retention-days: 14
      - name: Upload narrow captures
        if: always() && steps.budget.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bower-ui-audit-narrow-${{ github.run_number }}
          path: ui-audit-output/narrow/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: always() && steps.budget.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bower-ui-audit-diagnostics-${{ github.run_number }}
          path: ui-audit-output/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
